name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill contract
        shell: pwsh
        run: ./tests/validate-skill.ps1
      - name: Validate safety gate fixtures
        shell: pwsh
        run: ./tests/run-safety-gate-tests.ps1
